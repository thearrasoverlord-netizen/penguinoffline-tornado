name: Build single-file offline editor

on:
  push:
    branches:
      - offline-single-html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build standalone HTML
        run: npm run build:offline
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: PenguinMod-Offline-HTML
          path: |
            build-offline/PenguinMod.html
            build-offline/addons.html
          if-no-files-found: error
          retention-days: 14
