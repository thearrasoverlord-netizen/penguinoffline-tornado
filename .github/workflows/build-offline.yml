name: Build single-file offline editor

on:
  push:
    branches:
      - offline-single-html
  workflow_dispatch:

jobs:
  build-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build standalone HTML
        run: npm run build:offline
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: PenguinMod-Offline-HTML
          path: build-offline/PenguinMod.html
          if-no-files-found: error
          retention-days: 14
